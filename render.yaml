services:
  # ─── FastAPI Backend (WebSocket-capable) ─────────────────────────────────────
  - type: web
    name: kisansetu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free               # upgrade to 'starter' ($7/mo) for production
    region: singapore        # closest to India
    branch: main
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 10000           # Render assigns PORT=10000 by default

      # PostgreSQL — injected from the database service below
      - key: DATABASE_URL
        fromDatabase:
          name: kisansetu-db
          property: connectionString

      # Security — generate with: openssl rand -hex 32
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure random value

      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

      # CORS — add your Vercel frontend URL here
      - key: ALLOWED_ORIGINS
        value: "https://kisansetu-ai.vercel.app,https://kisansetu-ai-git-main-kisansetu.vercel.app"

      # Demo mode — keep true for SIH demo
      - key: DEMO_MODE
        value: true
      - key: DEMO_OTP
        value: 123456

      # SMS — SIMULATED by default; switch to MSG91 for real SMS
      - key: SMS_PROVIDER
        value: SIMULATED
      - key: SMS_SENDER_ID
        value: KSTUAI

      # Populate these via Render Dashboard > Environment after MSG91 signup
      - key: MSG91_AUTH_KEY
        value: ""
      - key: MSG91_OTP_TEMPLATE_ID
        value: ""
      - key: MSG91_BOOKING_TEMPLATE_ID
        value: ""
      - key: MSG91_PAYMENT_TEMPLATE_ID
        value: ""

  # ─── Managed PostgreSQL Database ─────────────────────────────────────────────
databases:
  - name: kisansetu-db
    plan: free                 # 256 MB RAM, 1 GB storage — sufficient for SIH demo
    region: singapore
    databaseName: kisansetu_db
    user: kisansetu
