name: Deploy & Refresh Database

on:
  # 1. Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      commit_updates:
        description: 'Commit updated database snapshot directly to main branch'
        required: true
        type: boolean
        default: true
  
  # 2. Automated trigger on schema, model, or seed changes
  push:
    branches:
      - main
    paths:
      - 'backend/app/models/**'
      - 'backend/app/database/**'
      - 'backend/requirements.txt'
      - 'supabase/**'

  # 3. Weekly automated refresh: renews 14-day procurement slots schedule
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  deploy-database:
    name: Build, Verify & Deploy Database
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🌾 Generate & Seed Local SQLite Database
        run: |
          python -m app.database.setup_local_db
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./kisansetu.db
          ENVIRONMENT: development
          DEMO_MODE: "true"

      - name: 🔄 Export Database Snapshot to Frontend Serverless Store
        run: |
          python -m app.database.export_seed_json
        working-directory: ./backend

      - name: 🧪 Run Backend Database & Algorithm Tests
        run: |
          python -m pytest tests/ -v
        working-directory: ./backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./kisansetu.db

      - name: ⚡ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏗️ Verify Next.js Serverless Database Build
        run: |
          npm install
          npm run build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: 💾 Upload Database Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kisansetu-database-snapshot
          path: |
            backend/kisansetu.db
            frontend/data/seed.json
            frontend/data/kisansetu_store.json
          retention-days: 90

      - name: 🚀 Commit & Deploy Database to Repository (Auto-Syncs Vercel)
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event.inputs.commit_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/seed.json frontend/data/kisansetu_store.json
          if git diff --staged --quiet; then
            echo "✅ Database is already up to date. No changes to commit."
          else
            git commit -m "chore(database): automated database deployment via GitHub Actions [skip ci]"
            git push origin main
            echo "🎉 Database snapshot committed and deployed to main!"
          fi
